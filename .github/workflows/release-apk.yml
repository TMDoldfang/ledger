name: Build APK and publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/ledger.jks

      - name: Unit tests
        env:
          LEDGER_STORE_FILE: ${{ runner.temp }}/ledger.jks
          LEDGER_STORE_PASSWORD: ${{ secrets.LEDGER_STORE_PASSWORD }}
          LEDGER_KEY_ALIAS: ${{ secrets.LEDGER_KEY_ALIAS }}
          LEDGER_KEY_PASSWORD: ${{ secrets.LEDGER_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          LEDGER_STORE_FILE: ${{ runner.temp }}/ledger.jks
          LEDGER_STORE_PASSWORD: ${{ secrets.LEDGER_STORE_PASSWORD }}
          LEDGER_KEY_ALIAS: ${{ secrets.LEDGER_KEY_ALIAS }}
          LEDGER_KEY_PASSWORD: ${{ secrets.LEDGER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.${{ github.run_number }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 簡記 build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: app/build/outputs/apk/release/app-release.apk